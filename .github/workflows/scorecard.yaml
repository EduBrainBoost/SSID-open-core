name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v3
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: false
