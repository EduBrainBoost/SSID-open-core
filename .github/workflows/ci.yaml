name: ci

on:
  push:
    branches: [main, "hermes/**"]
  pull_request:
    branches: [main]

jobs:
  structure:
    name: Structure & Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]"
      - run: python -m pytest 11_test_simulation/unit/test_opencore_policy.py -v
      - run: python -m pytest tests/test_opencore.py -v

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/ -v --cov=src/opencore --cov-report=xml

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[test]"
      - run: python -m pytest 11_test_simulation/ -v
